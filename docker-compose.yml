# Local development database.
# Production Postgres is provisioned on Railway at Phase 5 — this file is dev-only.
services:
  db:
    image: postgres:17
    container_name: tipsrum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tipsrum
      POSTGRES_PASSWORD: tipsrum
      POSTGRES_DB: tipsrum
    ports:
      - '5432:5432'
    volumes:
      - tipsrum-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tipsrum -d tipsrum']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tipsrum-db-data:
